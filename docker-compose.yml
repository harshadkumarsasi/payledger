services:
  db:
    image: postgres:17-alpine
    container_name: payledger-db
    environment:
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
      POSTGRES_DB: payledger
    ports:
      - "5432:5432"
    volumes:
      - payledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-db:
    image: postgres:17-alpine
    container_name: payledger-test-db
    environment:
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
      POSTGRES_DB: payledger_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payledger_data:
